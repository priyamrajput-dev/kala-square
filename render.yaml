services:
  - type: web
    name: kalasquare-api
    env: node
    plan: starter
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@kalasquare.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGIN
        value: https://kalasquare.com

